
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLUA VIP - License Tester</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#080610;color:white;
  font-family:Arial,sans-serif;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:20px
}
.panel{
  width:100%;max-width:390px;background:#151020;
  border:1px solid #762cff;border-radius:16px;
  padding:25px;box-shadow:0 0 25px #7020ff33
}
h2{text-align:center;color:#b88aff;margin-top:0}
p{text-align:center;color:#aaa;font-size:13px}
input,button{
  width:100%;padding:14px;border-radius:9px;
  margin-top:12px;font-size:15px
}
input{background:#090711;color:white;border:1px solid #57318a}
button{
  background:#782bdb;color:white;border:0;
  font-weight:bold
}
button:disabled{opacity:.5}
#result{
  margin-top:18px;padding:13px;border-radius:8px;
  background:#090711;text-align:center;overflow-wrap:anywhere
}
</style>
</head>
<body>
<div class="panel">
<h2>KILLUA VIP</h2>
<p>License Verification Tester</p>

<input id="key" type="text" placeholder="Enter License Key">

<button id="check" onclick="verifyLicense()">VERIFY LICENSE</button>

<div id="result">Waiting for verification...</div>
</div>

<script>
async function verifyLicense(){
  const key = document.getElementById("key").value.trim();
  const result = document.getElementById("result");
  const button = document.getElementById("check");

  if(!key){
    result.textContent = "Please enter your license key.";
    return;
  }

  button.disabled = true;
  result.textContent = "Checking license...";

  try{
    const response = await fetch(
      "https://killua-vip-api.onrender.com/api/validate",
      {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({key:key})
      }
    );

    const data = await response.json();

    if(response.ok && data.valid === true){
      result.textContent =
        "SUCCESS: " + data.message +
        (data.expiresAt ? " | Expires: " + data.expiresAt : "");
    }else{
      result.textContent = "FAILED: " + (data.message || "License invalid");
    }
  }catch(error){
    result.textContent = "Connection error. Please try again.";
  }

  button.disabled = false;
}
</script>
</body>
</html>
