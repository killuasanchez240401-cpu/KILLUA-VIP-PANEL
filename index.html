
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KILLUA VIP PANEL</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #080610;
  --panel: #110d1c;
  --purple: #a855f7;
  --light: #c084fc;
  --border: #342044;
  --text: #f5eaff;
  --muted: #a99ab8;
}

body {
  background:
    radial-gradient(ellipse at top, #28103e 0%, #080610 55%);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100vh;
  padding: 18px;
}

.container {
  width: 100%;
  max-width: 1050px;
  margin: auto;
}

header {
  text-align: center;
  padding: 28px 15px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: linear-gradient(135deg, #21102f, #100b19);
  box-shadow: 0 0 25px #8b35d522;
  margin-bottom: 20px;
}

.logo {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #d8a5ff;
  text-shadow: 0 0 15px #a855f7;
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin-top: 8px;
  letter-spacing: 2px;
}

.panel {
  background: #100c19ee;
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 0 20px #0008;
}

h2 {
  color: var(--light);
  font-size: 18px;
  margin-bottom: 16px;
}

h3 {
  font-size: 15px;
  color: #e9d5ff;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}

.stat {
  background: linear-gradient(145deg, #211331, #120c1d);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 18px 10px;
  text-align: center;
}

.stat-number {
  font-size: 27px;
  font-weight: bold;
  color: #d8a5ff;
  margin-bottom: 7px;
}

.stat-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

input, select {
  width: 100%;
  padding: 13px;
  color: white;
  background: #090711;
  border: 1px solid #49305d;
  border-radius: 9px;
  outline: none;
  margin-bottom: 12px;
  font-size: 14px;
}

input:focus, select:focus {
  border-color: var(--purple);
  box-shadow: 0 0 10px #a855f744;
}

select option {
  background: #100c19;
}

button {
  border: none;
  border-radius: 8px;
  padding: 11px 14px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  filter: brightness(1.2);
  transform: translateY(-1px);
}

.primary {
  background: linear-gradient(90deg, #7e22ce, #a855f7);
  color: white;
  width: 100%;
  padding: 14px;
  box-shadow: 0 0 14px #9333ea44;
}

.secondary {
  background: #30203f;
  border: 1px solid #654080;
  color: #e9d5ff;
}

.danger {
  background: #4a172c;
  border: 1px solid #a83259;
  color: #ffb5ca;
}

.success {
  background: #143b2c;
  border: 1px solid #287a55;
  color: #a7f3d0;
}

.warning {
  background: #493515;
  border: 1px solid #98702b;
  color: #fde68a;
}

.row {
  display: flex;
  gap: 10px;
}

.row > * {
  flex: 1;
  min-width: 0;
}

.key-card {
  background: linear-gradient(145deg, #1a1025, #100c19);
  border: 1px solid #49305d;
  border-radius: 12px;
  padding: 16px;
  margin-top: 12px;
}

.key-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.key-value {
  font-size: 14px;
  font-weight: bold;
  color: #d8b4fe;
  word-break: break-all;
  margin: 10px 0;
}

.status {
  font-size: 11px;
  padding: 6px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  font-weight: bold;
}

.status-active {
  color: #86efac;
  background: #14532d55;
  border: 1px solid #287a55;
}

.status-paused {
  color: #fde68a;
  background: #713f1255;
  border: 1px solid #98702b;
}

.status-expired {
  color: #fda4af;
  background: #88133755;
  border: 1px solid #a83259;
}

.key-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.key-actions button {
  flex: 1;
  min-width: 75px;
  font-size: 12px;
}

.details {
  display: none;
  border-top: 1px solid var(--border);
  margin-top: 14px;
  padding-top: 13px;
}

.details.open {
  display: block;
}

.detail-line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 0;
  font-size: 12px;
  border-bottom: 1px solid #ffffff0c;
}

.detail-line span:first-child {
  color: var(--muted);
}

.detail-line span:last-child {
  text-align: right;
  overflow-wrap: anywhere;
}

.countdown {
  color: #d8a5ff !important;
  font-weight: bold;
}

.message {
  margin-top: 12px;
  font-size: 13px;
  color: #c4b5fd;
  overflow-wrap: anywhere;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 25px 5px;
  font-size: 13px;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

.toolbar input {
  margin: 0;
}

.login-screen {
  max-width: 420px;
  margin: 65px auto;
}

.hidden {
  display: none !important;
}

.footer {
  text-align: center;
  color: #766783;
  font-size: 11px;
  padding: 18px;
}

@media(max-width: 650px) {
  body {
    padding: 10px;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .panel {
    padding: 15px;
  }

  .logo {
    font-size: 25px;
  }

  .detail-line {
    font-size: 11px;
  }
}
</style>
</head>

<body>
<div class="container">

  <div id="loginScreen" class="login-screen panel">
    <header>
      <div class="logo">KILLUA VIP</div>
      <div class="subtitle">ADMIN CONTROL PANEL</div>
    </header>

    <h2>Admin Login</h2>
    <input id="tokenInput" type="password"
      placeholder="Enter Admin Token">
    <button class="primary" id="loginBtn">LOGIN</button>
    <div id="loginMessage" class="message"></div>
  </div>

  <main id="mainPanel" class="hidden">

    <header>
      <div class="logo">KILLUA VIP</div>
      <div class="subtitle">LICENSE MANAGEMENT SYSTEM</div>
    </header>

    <div class="stats">
      <div class="stat">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">Total Keys</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="activeCount">0</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="pausedCount">0</div>
        <div class="stat-label">Paused</div>
      </div>
      <div class="stat">
        <div class="stat-number" id="expiredCount">0</div>
        <div class="stat-label">Expired</div>
      </div>
    </div>

    <section class="panel">
      <h2>✦ Generate New Key</h2>

      <div class="row">
        <input id="durationInput" type="number"
          min="1" max="365" value="1"
          placeholder="Duration">
        <select id="unitInput">
          <option value="minutes">Minutes</option>
          <option value="hours">Hours</option>
          <option value="days" selected>Days</option>
          <option value="months">Months</option>
        </select>
      </div>

      <button class="primary" id="generateBtn">
        GENERATE KEY
      </button>
      <div id="generateMessage" class="message"></div>
    </section>

    <section class="panel">
      <h2>✦ Generated Keys</h2>

      <div class="toolbar">
        <input id="searchInput" type="text"
          placeholder="Search key...">
      </div>

      <div id="keysList">
        <div class="empty">Loading keys...</div>
      </div>

      <button class="secondary" id="refreshBtn"
        style="width:100%;margin-top:15px">
        ↻ REFRESH KEYS
      </button>
    </section>

    <button class="danger" id="logoutBtn"
      style="width:100%">
      LOGOUT
    </button>

  </main>

  <div class="footer">KILLUA VIP PANEL</div>
</div>

<script>
const API_BASE = "https://killua-vip-api.onrender.com";

let adminToken = "";
let licenses = [];
let countdownTimer = null;

const $ = id => document.getElementById(id);

function showMessage(id, message, color) {
  const el = $(id);
  el.textContent = message;
  if (color) el.style.color = color;
}

async function api(path, method = "GET", body = null) {
  const options = {
    method,
    headers: {
      "Authorization": "Bearer " + adminToken
    }
  };

  if (body !== null) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }

  const response = await fetch(API_BASE + path, options);

  let data = {};
  try {
    data = await response.json();
  } catch (_) {}

  if (!response.ok) {
    throw new Error(data.error || data.message ||
      "Request failed (" + response.status + ")");
  }

  return data;
}

function formatDate(timestamp) {
  if (!timestamp) return "Not available";

  const date = new Date(timestamp);
  if (Number.isNaN(date.getTime())) return "Not available";

  return date.toLocaleString();
}

function formatDuration(duration, unit) {
  if (!duration || !unit) return "Not available";
  return duration + " " + unit;
}

function getRemaining(expiresAt) {
  const remaining = Number(expiresAt) - Date.now();

  if (!Number.isFinite(remaining) || remaining <= 0) {
    return "EXPIRED";
  }

  const seconds = Math.floor(remaining / 1000);
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor((seconds % 86400) / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;

  return days + "d " + hours + "h " +
    minutes + "m " + secs + "s";
}

function makeElement(tag, className, text) {
  const element = document.createElement(tag);
  if (className) element.className = className;
  if (text !== undefined) element.textContent = text;
  return element;
}

function addDetail(container, label, value, extraClass = "") {
  const line = makeElement("div", "detail-line");
  const left = makeElement("span", "", label);
  const right = makeElement("span", extraClass, value);

  line.append(left, right);
  container.appendChild(line);
  return right;
}

function updateStats() {
  $("totalCount").textContent = licenses.length;
  $("activeCount").textContent =
    licenses.filter(x => x.status === "active").length;
  $("pausedCount").textContent =
    licenses.filter(x => x.status === "paused").length;
  $("expiredCount").textContent =
    licenses.filter(x => x.status === "expired").length;
}

function renderKeys() {
  updateStats();

  const list = $("keysList");
  list.replaceChildren();

  const search = $("searchInput").value
    .trim().toLowerCase();

  const filtered = licenses.filter(license =>
    String(license.key || "").toLowerCase().includes(search)
  );

  if (!filtered.length) {
    list.appendChild(makeElement(
      "div", "empty",
      licenses.length ? "No matching keys found." :
      "No generated keys yet."
    ));
    return;
  }

  filtered.forEach(license => {
    const card = makeElement("div", "key-card");

    const top = makeElement("div", "key-top");
    top.appendChild(makeElement("h3", "", "LICENSE KEY"));

    const status = String(license.status || "unknown").toLowerCase();
    const statusBadge = makeElement(
      "span",
      "status status-" + (
        ["active", "paused", "expired"].includes(status)
          ? status : "expired"
      ),
      status
    );

    top.appendChild(statusBadge);
    card.appendChild(top);

    card.appendChild(makeElement(
      "div", "key-value", license.key || "Unknown key"
    ));

    const actions = makeElement("div", "key-actions");

    const copyBtn = makeElement("button", "secondary", "COPY");
    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(
          String(license.key || "")
        );
        copyBtn.textContent = "COPIED!";
        setTimeout(() => copyBtn.textContent = "COPY", 1500);
      } catch (_) {
        showMessage(
          "generateMessage",
          "Copy unavailable. Select and copy the key manually."
        );
      }
    });

    const detailsBtn = makeElement(
      "button", "secondary", "DETAILS"
    );

    const pauseBtn = makeElement(
      "button",
      status === "paused" ? "success" : "warning",
      status === "paused" ? "RESUME" : "PAUSE"
    );

    pauseBtn.disabled =
      status !== "active" && status !== "paused";

    pauseBtn.addEventListener("click", async () => {
      pauseBtn.disabled = true;

      try {
        const action = status === "paused" ? "resume" : "pause";
        await api(
          "/api/admin/keys/" + encodeURIComponent(license.id) +
          "/" + action,
          "POST"
        );

        await loadKeys();
      } catch (error) {
        alert(error.message);
        pauseBtn.disabled = false;
      }
    });

    const deleteBtn = makeElement(
      "button", "danger", "DELETE"
    );

    deleteBtn.addEventListener("click", async () => {
      if (!confirm("Delete this key permanently?")) return;

      deleteBtn.disabled = true;

      try {
        await api(
          "/api/admin/keys/" + encodeURIComponent(license.id),
          "DELETE"
        );
        await loadKeys();
      } catch (error) {
        alert(error.message);
        deleteBtn.disabled = false;
      }
    });

    actions.append(copyBtn, detailsBtn, pauseBtn, deleteBtn);
    card.appendChild(actions);

    const details = makeElement("div", "details");

    addDetail(
      details, "Key ID",
      license.id || "Not available"
    );

    addDetail(
      details, "Validity",
      formatDuration(license.duration, license.unit)
    );

    addDetail(
      details, "Created",
      formatDate(license.createdAt)
    );

    addDetail(
      details, "Expires",
      formatDate(license.expiresAt)
    );

    const countdown = addDetail(
      details, "Time Remaining",
      getRemaining(license.expiresAt),
      "countdown"
    );

    detailsBtn.addEventListener("click", () => {
      details.classList.toggle("open");
      detailsBtn.textContent =
        details.classList.contains("open")
          ? "HIDE DETAILS" : "DETAILS";
    });

    card.appendChild(details);
    list.appendChild(card);

    if (details.classList.contains("open")) {
      countdown.textContent = getRemaining(license.expiresAt);
    }
  });
}

async function loadKeys() {
  $("refreshBtn").disabled = true;

  try {
    const data = await api("/api/admin/keys");
    licenses = Array.isArray(data.keys) ? data.keys : [];
    renderKeys();
  } catch (error) {
    showMessage("generateMessage", error.message, "#fda4af");

    if (error.message.toLowerCase().includes("unauthorized") ||
        error.message.toLowerCase().includes("invalid token")) {
      logout();
    }
  } finally {
    $("refreshBtn").disabled = false;
  }
}

async function login() {
  const token = $("tokenInput").value.trim();

  if (!token) {
    showMessage("loginMessage", "Enter your admin token.", "#fda4af");
    return;
  }

  adminToken = token;
  $("loginBtn").disabled = true;

  try {
    await loadKeys();

    $("loginScreen").classList.add("hidden");
    $("mainPanel").classList.remove("hidden");

    if (countdownTimer) clearInterval(countdownTimer);

    countdownTimer = setInterval(() => {
      document.querySelectorAll(".key-card").forEach(card => {
        const details = card.querySelector(".details");
        if (!details || !details.classList.contains("open")) return;

        const keyText = card.querySelector(".key-value")?.textContent;
        const license = licenses.find(x => x.key === keyText);
        const countdown = details.querySelector(".countdown");

        if (license && countdown) {
          countdown.textContent = getRemaining(license.expiresAt);
        }
      });
    }, 1000);

  } catch (error) {
    adminToken = "";
    showMessage("loginMessage", error.message, "#fda4af");
  } finally {
    $("loginBtn").disabled = false;
  }
}

async function generateKey() {
  const duration = Number($("durationInput").value);
  const unit = $("unitInput").value;

  if (!Number.isInteger(duration) || duration < 1 || duration > 365) {
    showMessage(
      "generateMessage",
      "Duration must be a whole number from 1 to 365.",
      "#fda4af"
    );
    return;
  }

  $("generateBtn").disabled = true;
  $("generateBtn").textContent = "GENERATING...";

  try {
    const data = await api("/api/admin/generate", "POST", {
      duration,
      unit
    });

    showMessage(
      "generateMessage",
      "Key generated: " + (data.key || "Success"),
      "#86efac"
    );

    await loadKeys();

  } catch (error) {
    showMessage("generateMessage", error.message, "#fda4af");
  } finally {
    $("generateBtn").disabled = false;
    $("generateBtn").textContent = "GENERATE KEY";
  }
}

function logout() {
  adminToken = "";
  licenses = [];

  if (countdownTimer) {
    clearInterval(countdownTimer);
    countdownTimer = null;
  }

  $("mainPanel").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("tokenInput").value = "";
  $("keysList").replaceChildren();
  $("loginMessage").textContent = "";
  $("generateMessage").textContent = "";
}

$("loginBtn").addEventListener("click", login);

$("tokenInput").addEventListener("keydown", event => {
  if (event.key === "Enter") login();
});

$("generateBtn").addEventListener("click", generateKey);
$("refreshBtn").addEventListener("click", loadKeys);
$("logoutBtn").addEventListener("click", logout);
$("searchInput").addEventListener("input", renderKeys);
</script>
</body>
</html>
